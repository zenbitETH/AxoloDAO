description:
  es: "Museo de ajolotes en Querétaro dedicado al cuidado, la reproducción ex situ y la divulgación de Ambystoma. Articula educación pública con investigación y publica sus pruebas de agua, cada lectura con su fecha."
  en: "Axolotl museum in Querétaro dedicated to the care, ex-situ reproduction and public outreach of Ambystoma. It bridges public education with research and publishes its water tests, each reading dated."
  pt: "Museu de axolotes em Querétaro dedicado ao cuidado, à reprodução ex situ e à divulgação de Ambystoma. Conecta educação pública com pesquisa e publica seus testes de água, cada leitura com sua data."
