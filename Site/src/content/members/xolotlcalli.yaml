  es: Piloto de conservación y práctica de campo (2025–2026)
  en: Conservation and field-practice pilot (2025–2026)
  pt: Piloto de conservação e prática de campo (2025–2026)
description:
  es: "Museo de ajolotes en Querétaro que operó de octubre de 2025 a septiembre de 2026. Fue el piloto de AxoloDAO: acercó la conservación de Ambystoma al público y publicó sus pruebas de agua, cada lectura con su fecha. Su archivo sigue disponible."
  en: "Axolotl museum in Querétaro that operated from October 2025 to September 2026. It was AxoloDAO's pilot: it brought Ambystoma conservation closer to the public and published its water tests, each reading dated. Its archive remains available."
  pt: "Museu de axolotes em Querétaro que funcionou de outubro de 2025 a setembro de 2026. Foi o piloto da AxoloDAO: aproximou do público a conservação de Ambystoma e publicou seus testes de água, cada leitura com sua data. Seu arquivo continua disponível."
