iucn: EN
nom059: Pr
description: Los individuos neoténicos de esta especie presentan hasta 100 mm de longitud hocico-cloaca (LHC) y hasta 86 mm de LHC en adultos metamórficos. La cola es igual o un poco más corta que el cuerpo. Los adultos metamórficos son de color gris oscuro a negro en la parte dorsal, y la parte ventral gris oscuro y opaco uniforme. En algunos individuos el dorso presenta manchas claras y en otros individuos se presentan tres líneas de puntos claros en sus diferentes regiones dorsal, lateral y ventrolateral. Generalmente presentan 12 surcos costales (Aguilar-Miguel, 2005).
habitat: Habita en arroyos y manantiales a altitudes mayores a 2,200 msnm en bosques de encino, pino y oyamel. Montes-Calderón et al. (2011) estudiaron una población de Ambystoma ordinarium en la localidad conocida como Agua Zarca en Michoacán y reportan que los organismos están en condiciones de entre 10 y 50 cm de profundidad; el ancho del arroyo es de entre 0.5 y 3.5 m, la temperatura promedio del agua es de $15^{\circ}C$ y la velocidad media de la corriente es de $0.28m/seg.$ Los adultos metamórficos también pueden observarse en troncos podridos o debajo de ellos en las inmediaciones de los arroyos (Anderson y Worthington, 1971).
distribution: Esta especie se distribuye en el noreste del estado de Michoacán. Hay poblaciones reportadas desde Zitácuaro (cerca del Estado de México), pasando por Morelia hasta Tacámbaro entre los 2,400 a 2,900 msnm (IUCN SSC Amphibian Specialist Group, 2015; Medina-Agui- lar et al., 2011). Esta especie habita arroyos o manantiales de montaña en bosques templados en el estado de Michoacán. En el 2001 Huacúz reporta la presencia de esta especie en varias de las localidades reportadas e incluso hace el primer registro de ejemplares para algunas de ellas, todas dentro de los límites del Estado de Michoacán.
threats: Pérdida y degradación del hábitat debido a urbanización, agricultura, ganadería. Extracción no sustentable de los arroyos, contaminación de los cuerpos de agua e introducción de peces exóticos (eg. Cyprinus carpio, Oreochromis aureus, O. mossambicus, O. niloticus) (IUCN SSC Amphibian Specialist Group, 2015).
feeding: Se ha documentado que esta especie en vida libre consume hasta 57 tipos de presas, principalmente insectos de las familias Chironomidae, Baetidae, Daphniidae, Simuliidae, y crustáceos del orden Ostracoda (Ruíz-Martínez et al., 2013).
reproduction: La madurez sexual se presenta en tallas de 70 a 75 mm de longitud hocico-cloaca (LHC) tanto en neoténicos como metamórficos. Esta especie presenta puestas de huevos de entre 92 y 192 huevos con un promedio de 109. Los huevos miden en promedio 2.8mm de diá- metro. Las puestas de huevos son adheridas a la vegetación acuática o ramas. La temporada reproductiva de esta especie podría ser entre los meses de junio a enero o a través de todo el año (Anderson y Worthington, 1971).
