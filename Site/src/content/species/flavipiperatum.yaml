  Rosas-Espinoza, V. C., E.S. García-Mata, A.L. Santiago-Pérez y J. Villarreal-Méndez. 2014. Herpetofauna asociada a madrigueras de la tuza Pappogeomys bulleri en el bosque templado de sierra de Quila, Jalisco. Revista Mexicana de Biodiversidad, 85(1), 328-331.

  Rosas-Espinoza, V. C., J.M. Rodríguez-Canseco, A.L. Santiago-Pérez, A. Ayón-Escobedo y M. Domínguez-Laso. (2013). Distribution of some amphibians from central western Mexico: Jalisco. Revista Mexicana de Biodiversidad, 84(2), 690-696.

  Santiago-Pérez, A. L., M. Domínguez-Laso, V. C. Rosas-Espinoza y J. M. Rodríguez-Canseco. 2012. Anfibios y Reptiles de las Montañas de Jalisco. Sierra de Quila. Universidad de Guadalajara / CONABIO (Comisión Nacional para el Conocimiento y Uso de la Biodiversidad), México.
feeding: Se alimenta de insectos, moluscos y lombrices (Santiago-Pérez et al., 2012).
reproduction: No existen datos específicos sobre su biología reproductiva.
