nom059: A
description: Se analizaron 75 machos y 55 hembras de Ambystoma rivulare. Los machos alcanzaron de longitud hocico-cloaca (LHC) de 85 mm y 114 mm de longitud total (LT). Las hembras alcanzaron 87 mm de LHC y 115 de LT (Sánchez-Manjarrez, 2017). En el dorso la coloración tiene tonos negruzcos y grisáceos en los lados. Presentan manchas amarillas o negras en la porción dorsal (Taylor, 1940a).
habitat: Habita en arroyos con poca corriente de agua en zonas de montaña entre los 2,720 y 3,180 msnm (Woolrich-Piña et al., 2017).
distribution: Se distribuye en zonas montañosas del Eje Neovolcánico en los estados de Estado de México, Michoacán y Guerrero. La localidad tipo de la especie se ubica en las serranías que limitan al Estado de México y Michoacán, a 13 km de la localidad de Villa Victoria en el Estado de México. Además, se conocen poblaciones en la Ciudad de México, así como en las partes adyacentes del Estado de México y en el Nevado de Toluca. Existe, además una población en el estado de Guerrero (Shaffer et al., 2008).
threats: Pérdida del hábitat y uso no sustentable de los arroyos en su área de distribución.
feeding: No existen datos específicos sobre su alimentación, pero se puede asumir que se alimentan de invertebrados terrestres y acuáticos pequeños.
reproduction: Se ha reportado la ovoposición el 30 de junio del 2010 de una hembra que se colecto en campo y que se mantuvo en cautiverio. Al momento de la ovoposición la hembra midió 100mm de longitud de hocico-cloaca (LHC) y 197mm de longitud total (LT), con un peso de 38 gr. En este evento el tamaño de la puesta fue de 463 huevos, los cuales fueron depositados en un acuario de 40 lt a $18^{\circ}C$ En promedio los huevos alcanzaron $1.96\pm0.19$ mm, con un rango de 1.70-2.50 mm. Se observó una fertilidad de 86% y las crías eclosionaron entre las 288 y 312 hrs. Existe el reporte de un avistamiento de puesta de huevos en campo en primavera y verano de Brandon y Altig (1973) y Bille (2009) respectivamente citados en Legorreta-Balbuena et al. (2014).
