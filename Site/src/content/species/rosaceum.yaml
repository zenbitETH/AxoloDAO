description: |-
  Esta especie rara vez presenta neotenia, los adultos metamórficos alcanzan 85 mm de longitud hocico cloaca (LHC), y 152.0 mm de longitud total (LT). El tamaño al cual alcanzan la metamorfosis varia de 48.0 a 62.0 mm LHC y de 98.0 a 121.0 mm LT. Al momento de la eclosión las larvas miden entre 9 a 10 mm de LHC (Anderson, 1961; Anderson y Webb, 1978, Lemos-Espinal, 2003).

  Las larvas de entre 9 y 35 mm presentan una coloración oscura en la porción dorsal y crema en la región ventral. Las larvas de más de 35 mm tienen manchas o manchas claras de color blanco, amarillo o rosa sobre un fondo café oscuro (Anderson, 1961: Anderson y Webb, 1978; Lemos-Espinal, 2003).

  Los individuos metamórficos presentan una coloración café oscura con puntos de colores blanco a amarillo en los costados o la porción dorsal. El vientre y la región gular es de color café a crema. El vientre es color crema o amarillo y puede presentar manchas claras (Anderson, 1961; Anderson y Webb, 1978; Lemos-Espinal, 2003).
habitat: Habita en arroyos de poca profundidad y baja corriente que corren bosques de pino, encino y pastizales. Los individuos metamórficos viven bajo troncos, rocas o refugios que mantengan mucha humedad en los alrededores de los arroyos (Anderson y Web, 1978).
distribution: Esta especie es endémica para México y se distribuye únicamente en la Sierra Madre Occidental. Habita en arroyos pequeños en los estados de Chihuahua, Durango, Jalisco, Nayarit, Sinaloa, Sonora y Zacatecas (Lemos-Espinal et al., 2015; IUCN, 2015) entre los 1,000 y 3,110 msnm (Carbajal-Márquez et al., 2015).
threats: Las principales amenazas de esta especie es la pérdida del hábitat y la contaminación de los arroyos (Carbajal-Márquez et al., 2015, Lemos-Espinal, 2003).
feeding: No existen datos específicos sobre su alimentación, pero se puede asumir que se alimentan de invertebrados terrestres y acuáticos pequeños.
reproduction: Se ha registrado huevos en los meses de julio en arroyos con poca corriente o pozas, Los huevos son adheridos a sustratos como troncos, vegetación acuática o bajo rocas a una profundidad de hasta 10 cm de la superficie. Los cúmulos de huevos pueden medir hasta 15 mm mientras que los huevos miden en promedio 2.6 mm; el periodo de incubación podría ser de entre 20 y 25 días con una temperatura ambiental de 11 a $15^{\circ}C$.
