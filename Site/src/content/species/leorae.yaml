  - "Shaffer, H.B. 2008. Ambystoma leorae. The IUCN Red List of Threatened Species 2008: e.T1968A11878414."
  - "Sunny, A., O. Monroy-Vilchis, V. Fajardo y U. Aguilera-Reyes. 2014. Genetic diversity and structure of an endernic and critically endangered stream river salamander (Caudata: Ambystoma leorae) in Mexico. Conservation Genetics 1:49-59."
