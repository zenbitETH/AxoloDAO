  - Ramírez-Bautista, A., U. Hernández-Salinas, U. O. García-Vázquez, A. Leyte-Manrique y L. Canseco-Márquez. 2009. Herpetofauna del Valle de México. Diversidad y Conservación. Universidad Autónoma del Estado de Hidalgo/Comisión Nacional para el Conocimiento y Uso de la Biodiversidad. D. F. México. 240 p.
  - "Recuero, E., J. Cruzado-Cortes, G. Parra-Olea y K.R. Zamudio. 2010. Urban aquatic habitats and conservation of highly endangered species: the case of Ambystoma mexicanum (Caudata, Ambystomatidae). In: Annales Zoologici Fennici (pp. 223-238). Finnish Zoological and Botanical Publishing Board."
  - Shaw, G. y F.P. Nodder. 1798. The Naturalist's Miscellany. Vol. 9.
