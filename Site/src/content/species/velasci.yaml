description: Son organismos robustos con una longitud hocico-cloaca (LHC) de en promedio $106.4 \pm 21$mm, cola de $35\pm13.4mm$; largo de la cabeza de $58.2\pm26$ 26.5mm, ancho de la cabeza de $27\pm2mm$ y la altura de la cola de $19.2\pm2.1$ mm (Ramírez-Bautista et al., 2009). Los individuos neoténicos son de color café oscuro en la región ventral con manchas amarillas o amarillos con manchas negras, incluso algunos con manchas muy poco conspicuas. Los individuos metamórficos son café oscuro con manchas negras amarillas o crema y con la región ventral también clara.
habitat: Habita en arroyos, cuerpos de agua y sus alrededores, en pastizales, matorrales y bosques de encino.
distribution: "Probablemente es la especie endémica a México con mayor extensión de distribución en el país, la cual abarca desde localidades muy cercanas a los límites con Estados Unidos, pasando por el Altiplano hasta el Eje Volcánico Transversal, muy cerca de la Ciudad de México. Los estados en donde se distribuye esta especie son: Michoacán, Estado de México, Puebla, Tlaxcala, Veracruz, Coahuila, y Querétaro (Dixon y Lemos-Espinal, 2010, Shaffer et al., 2010; Aguilar-Miguel, 2005)."
threats: Las principales amenazas de esta especie es la pérdida del hábitat y la contaminación y extracción del agua de los cuerpos de agua donde se distribuye, en algunos sitios existe una extracción ilegal de individuos para consumo y elaboración de remedios tradicionales.
feeding: No existen datos específicos sobre su alimentación, pero se puede asumir que se alimentan de invertebrados terrestres y acuáticos pequeños.
reproduction: Los ejemplares reproductivos más pequeños reportados son de hasta 96 mm.
