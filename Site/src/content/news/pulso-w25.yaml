caption:
  es: "Pulso AxoloDAO · Semana 25 — las larvas de A. mexicanum dispararon el amoníaco a 1 ppm en su pecera chica y ya pasaron al sistema grande, sanas y comiendo; contamos el origen de Xovi, de ETHGlobal San Francisco 2024 a la colaboración con Inteli rumbo a registrar la biodiversidad de México y Brasil; y abrimos convocatoria con la Secretaría de Cultura de Querétaro para que artistas queretanos ilustren los 108 comportamientos del ajolote. La próxima semana, primer invitado especial y las salamandras gigantes que parecen ajolotes."
  en: "Pulso AxoloDAO · Week 25 — the A. mexicanum larvae spiked ammonia to 1 ppm in their small tank and have moved into the big system, healthy and feeding; we tell the origin of Xovi, from ETHGlobal San Francisco 2024 to the collaboration with Inteli toward recording the biodiversity of Mexico and Brazil; and we open a call with Querétaro's Secretaría de Cultura for local artists to illustrate the axolotl's 108 behaviors. Next week, our first special guest and the giant salamanders that look like axolotls."
  pt: "Pulso AxoloDAO · Semana 25 — as larvas de A. mexicanum dispararam a amônia para 1 ppm no aquário pequeno e já passaram para o sistema grande, saudáveis e se alimentando; contamos a origem do Xovi, do ETHGlobal San Francisco 2024 à colaboração com o Inteli rumo a registrar a biodiversidade do México e do Brasil; e abrimos uma convocatória com a Secretaría de Cultura de Querétaro para que artistas queretanos ilustrem os 108 comportamentos do axolote. Na próxima semana, nosso primeiro convidado especial e as salamandras gigantes que parecem axolotes."
