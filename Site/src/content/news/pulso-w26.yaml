caption:
  es: "Pulso AxoloDAO · Semana 26 — el veterinario visitó a los ajolotes el lunes para la desparasitación semestral, los pesamos uno a uno y revisamos su salud; Lupita y May, las colaboradoras que sostienen el día a día de Xolotlcalli, nos acompañan en el podcast; y las suscripciones de Xovi ya están en vivo, para apoyar a Xolotlcalli y participar capturando comportamientos. La próxima semana nos visita el Dr. Raciel Cruz, del Cuerpo Académico de Ecología y Diversidad Faunística de la UAQ y experto en Ambystoma velasci."
  en: "Pulso AxoloDAO · Week 26 — the vet visited the axolotls on Monday for their biannual deworming, we weighed each one and checked their health; Lupita and May, the collaborators who keep Xolotlcalli running day to day, join us on the podcast; and Xovi subscriptions are now live, to support Xolotlcalli and take part by capturing behaviors. Next week we are joined by Dr. Raciel Cruz, of the UAQ's Ecology and Faunal Diversity Academic Group and an expert on Ambystoma velasci."
  pt: "Pulso AxoloDAO · Semana 26 — o veterinário visitou os axolotes na segunda-feira para a desparasitação semestral, pesamos cada um e revisamos sua saúde; Lupita e May, as colaboradoras que sustentam o dia a dia da Xolotlcalli, nos acompanham no podcast; e as assinaturas do Xovi já estão no ar, para apoiar a Xolotlcalli e participar capturando comportamentos. Na próxima semana, recebemos o Dr. Raciel Cruz, do Corpo Acadêmico de Ecologia e Diversidade Faunística da UAQ e especialista em Ambystoma velasci."
