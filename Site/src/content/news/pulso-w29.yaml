  es: "Pulso AxoloDAO · Semana 29 — honramos a Panchita y Goldy, dos bajas muy sentidas: con Panchita se cierra la línea de A. andersoni y la próxima semana llegan nuevos ejemplares; El Ajolote Observado sigue recibiendo obra hasta el 7 de agosto, una por cada comportamiento del ajolote; y adelanto del podcast: nos visita Dulce Díaz de Pregúntale al biólogo."
  en: "Pulso AxoloDAO · Week 29 — we honor Panchita and Goldy, two deeply felt losses: with Panchita the A. andersoni line closes and new specimens arrive next week; El Ajolote Observado keeps receiving artwork until August 7, one for each axolotl behavior; and a podcast preview: Dulce Díaz of Pregúntale al biólogo joins us."
