caption:
  es: "Pulso AxoloDAO · Semana 35 — las noticias de la quincena: ya hay un andersoni en la sala, el primero desde la baja de Panchita, y con él vuelven a ser doce ejemplares y tres especies; Tamal cumple once días en cuarentena; se muerden entre ellos, y así es como pierden patas, algo que la ciencia de la regeneración casi no mira porque estudia amputaciones de quirófano; cuatro semanas para volver a tener una pata; un acuario de California le abre un jardín al ajolote; y dieciséis salas en el mundo, de las que la primera fue en París."
  en: "Pulso AxoloDAO · Week 35 — the fortnight's news: there is an andersoni in the room again, the first since Panchita's death, bringing the count back to twelve specimens and three species; Tamal is eleven days into quarantine; they bite each other, and that is how they lose limbs — something regeneration science barely looks at, because it studies surgical amputations; four weeks to grow a leg back; a California aquarium opens a garden to the axolotl; and sixteen rooms worldwide, the first of them in Paris."
  pt: "Pulso AxoloDAO · Semana 35 — as notícias da quinzena: já há um andersoni na sala, o primeiro desde a morte de Panchita, e com ele voltam a ser doze exemplares e três espécies; Tamal completa onze dias em quarentena; eles se mordem, e é assim que perdem patas — algo que a ciência da regeneração quase não observa, porque estuda amputações cirúrgicas; quatro semanas para ter uma pata de volta; um aquário da Califórnia abre um jardim ao axolote; e dezesseis salas no mundo, a primeira delas em Paris."
