  es: "Pulso AxoloDAO · Semana 23 — Panchita recibe el alta y vuelve al Biomuseo tras cerrar el tratamiento de su ojo, estrenamos nuestra propia fórmula de agua bajando el NaCl a 0.3 g/L y subiendo las sales minerales, Xovi suma el álbum del ajolote para capturar comportamientos que Alex valida, y evento de testers Xovi el miércoles 10 de junio en Ndali con registro gratuito."
