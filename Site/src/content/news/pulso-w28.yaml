caption:
  es: "Pulso AxoloDAO · Semana 28 — las pruebas de agua del lunes ahora se transmiten en vivo, camino a lecturas automáticas por cámara; hablamos de lo difícil que es mantener un ajolote en cautiverio y de por qué comprarlo como mascota suele condenarlo; y lanzamos El Ajolote Observado, una convocatoria de arte con 35 obras, una por cada comportamiento del ajolote documentado en Xovi."
  en: "Pulso AxoloDAO · Week 28 — the Monday water tests are now streamed live, on the way to automated camera readings; we discuss how hard it is to keep an axolotl in captivity and why buying one as a pet usually condemns it; and we launch El Ajolote Observado, an art open call with 35 works, one for each axolotl behavior documented on Xovi."
  pt: "Pulso AxoloDAO · Semana 28 — os testes de água de segunda-feira agora são transmitidos ao vivo, a caminho de leituras automáticas por câmera; falamos sobre como é difícil manter um axolote em cativeiro e por que comprá-lo como animal de estimação costuma condená-lo; e lançamos El Ajolote Observado, uma convocatória de arte com 35 obras, uma para cada comportamento do axolote documentado no Xovi."
