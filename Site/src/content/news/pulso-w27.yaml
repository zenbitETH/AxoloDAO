  es: "Pulso AxoloDAO · Semana 27 — estrenamos nuestro primer invitado especial en el podcast: el Dr. Raciel Cruz, experto en Ambystoma velasci, el ajolote silvestre, que nos explica por qué el campo y el laboratorio se complementan; hablamos del Pokémon con branquias de ajolote y de la salamandra gigante asiática que se le parece; y con Xovi ya puedes adoptar un ajolote del Biomuseo sin salir de casa y sumar ciencia ciudadana."
  en: "Pulso AxoloDAO · Week 27 — we welcome our first special guest to the podcast: Dr. Raciel Cruz, an expert on Ambystoma velasci, the wild axolotl, who explains why fieldwork and the lab complement each other; we talk about the Pokémon with axolotl gills and the Asian giant salamander that resembles it; and with Xovi you can now adopt an axolotl from the Biomuseo without leaving home and take part in citizen science."
  pt: "Pulso AxoloDAO · Semana 27 — estreamos nosso primeiro convidado especial no podcast: o Dr. Raciel Cruz, especialista em Ambystoma velasci, o axolote silvestre, que nos explica por que o campo e o laboratório se complementam; falamos do Pokémon com brânquias de axolote e da salamandra gigante asiática que se parece com ele; e com o Xovi você já pode adotar um axolote do Biomuseo sem sair de casa e somar ciência cidadã."
