caption:
  es: "Pulso AxoloDAO · Semana 37 — las noticias de la quincena: Tamalito salió de cuarentena y regresó a su pecera; llegan dos andersoni más, que antes de entrar a la sala pasan por desparasitación y ambientación porque los tres de la reserva dieron positivo a nematodos; en anfibios de cautiverio los nematodos son la norma, y una revisión señala a los rabdítidos como los que de verdad enferman; de la ivermectina hay dosis descritas, pero ninguna para Ambystoma; siete recintos con ajolotes en México, en tres estados; y el agua de la quincena, con la estación del andersoni subiendo a 2 de nitritos y 30 de nitratos en un sistema que todavía no cicla."
  en: "Pulso AxoloDAO · Week 37 — the fortnight's news: Tamalito is out of quarantine and back in his tank; two more andersoni are arriving, and before they enter the room they go through deworming and acclimation, because the three in reserve tested positive for nematodes; in captive amphibians nematodes are the norm, and a review singles out rhabditids as the ones that actually cause disease; ivermectin has published doses, but none for Ambystoma; seven venues with axolotls in Mexico, across three states; and the fortnight's water, with the andersoni station rising to 2 nitrite and 30 nitrate in a system that has not cycled yet."
  pt: "Pulso AxoloDAO · Semana 37 — as notícias da quinzena: Tamalito saiu da quarentena e voltou ao seu aquário; chegam mais dois andersoni, que antes de entrar na sala passam por desparasitação e aclimatação, porque os três da reserva deram positivo para nematoides; em anfíbios de cativeiro os nematoides são a regra, e uma revisão aponta os rabditídeos como os que de fato adoecem; da ivermectina há doses descritas, mas nenhuma para Ambystoma; sete espaços com axolotes no México, em três estados; e a água da quinzena, com a estação do andersoni subindo para 2 de nitrito e 30 de nitrato num sistema que ainda não ciclou."
