caption:
  es: "Pulso AxoloDAO · Semana 30 — en el podcast 19 nos visita Dulce Díaz de Pregúntale al Biólogo, que con humor y empatía hace que la ciencia por fin llegue; nos comparte su experiencia de campo reubicando nidos y viendo nacer miles de crías de tortuga marina; Javier Ortega Quezada, nuestro primer suscriptor en Xovi, apadrina a la Larva 1, ahora llamada Patito; y reflexionamos sobre la cultura de comunicar la ciencia con propósito."
  en: "Pulso AxoloDAO · Week 30 — on podcast 19 we're joined by Dulce Díaz of Pregúntale al Biólogo, who with humor and empathy finally makes science land; she shares her field experience relocating nests and watching thousands of sea-turtle hatchlings born; Javier Ortega Quezada, our first Xovi subscriber, sponsors Larva 1, now named Patito; and we reflect on the culture of communicating science with purpose."
  pt: "Pulso AxoloDAO · Semana 30 — no podcast 19 recebemos Dulce Díaz do Pregúntale al Biólogo, que com humor e empatia faz a ciência finalmente chegar; ela compartilha sua experiência de campo realocando ninhos e vendo nascer milhares de filhotes de tartaruga marinha; Javier Ortega Quezada, nosso primeiro assinante no Xovi, apadrinha a Larva 1, agora chamada Patito; e refletimos sobre a cultura de comunicar a ciência com propósito."
