caption:
  es: "Pulso AxoloDAO · Semana 24 — clausuramos un filtro y unimos los dos muebles de A. mexicanum en un sistema AM más robusto, llevamos al ajolote al Día del Medio Ambiente con un stand junto a la Semarnat en el Parque La Queretana entre microplásticos, Xovi y mucha curiosidad estudiantil, y recordamos que el ajolote rosa no existe: la moda de los ajolotes de colores impulsa el tráfico, como el “efecto Nemo”, así que amemos al ajolote real. La próxima semana compartimos los resultados del onboarding de testers de Xovi en Ndali."
  en: "Pulso AxoloDAO · Week 24 — we retire one filter and merge the two A. mexicanum units into a sturdier AM system, we take the axolotl to World Environment Day with a stand alongside Semarnat at Parque La Queretana amid microplastics, Xovi and plenty of student curiosity, and we remember that the pink axolotl does not exist: the craze for colorful axolotls fuels trafficking, like the “Nemo effect”, so let's love the real axolotl. Next week we share the results of the Xovi tester onboarding at Ndali."
  pt: "Pulso AxoloDAO · Semana 24 — desativamos um filtro e unimos os dois módulos de A. mexicanum em um sistema AM mais robusto, levamos o axolote ao Dia do Meio Ambiente com um estande ao lado da Semarnat no Parque La Queretana em meio a microplásticos, Xovi e muita curiosidade estudantil, e lembramos que o axolote rosa não existe: a moda dos axolotes coloridos impulsiona o tráfico, como o “efeito Nemo”, então amemos o axolote real. Na próxima semana compartilhamos os resultados do onboarding de testers da Xovi em Ndali."
