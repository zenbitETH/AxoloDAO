  es: "Pulso AxoloDAO · Semana 32 — AxoloNews: los nematodos volvieron y esta vez fueron dos, Chocorrol y Limón, los dos en seguimiento; el gen que ordena la regeneración se llama SP8 y sin él el ajolote regenera desordenado; y el IMPI confirmó que el ajolote nunca fue mascota del Mundial."
