  es: Mantenimiento semanal del BioMuseo en vivo y podcast nocturno con la microDAO.
  en: Weekly BioMuseum maintenance livestream paired with the nighttime AxoloDAO podcast.
  pt: Manutenção semanal do BioMuseu ao vivo e podcast noturno com a microDAO.
description:
  es: Cada lunes el equipo de Xolotlcalli realiza pruebas de calidad del agua y mantenimiento de los acuarios en vivo desde el BioMuseo. Por la noche, el podcast AxoloDAO comenta los hallazgos con Alex (Xolotlcalli), Juan (Ndali) y Habacuc (Zenbit), abriendo el diálogo a la comunidad.
  en: Every Monday the Xolotlcalli team runs water-quality tests and tank maintenance live from the BioMuseum. At night, the AxoloDAO podcast unpacks the findings with Alex (Xolotlcalli), Juan (Ndali) and Habacuc (Zenbit), opening the conversation to the community.
  pt: Toda segunda-feira a equipe da Xolotlcalli realiza testes de qualidade da água e manutenção dos aquários ao vivo no BioMuseu. À noite, o podcast da AxoloDAO comenta os achados com Alex (Xolotlcalli), Juan (Ndali) e Habacuc (Zenbit), abrindo o diálogo à comunidade.
