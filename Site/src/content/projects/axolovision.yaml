description:
  es: Axolovision es una transmisión en YouTube desde el BioMuseo Xolotlcalli, en desarrollo, que combinará el monitoreo permanente de los ajolotes con dinámicas onchain durante la transmisión. Los espectadores podrán disparar acciones, votaciones y registros que queden asentados en la cadena.
  en: Axolovision is a YouTube livestream from the Xolotlcalli BioMuseum, under development, that will pair continuous monitoring of the axolotls with live onchain dynamics. Viewers will be able to trigger actions, votes and on-record events that settle on chain.
  pt: A Axolovision é uma transmissão no YouTube desde o BioMuseu Xolotlcalli, em desenvolvimento, que combinará o monitoramento contínuo dos axolotes com dinâmicas onchain ao vivo. Espectadores poderão disparar ações, votações e registros que se assentem na cadeia.
