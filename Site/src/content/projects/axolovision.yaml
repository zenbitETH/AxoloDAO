description:
  es: Axolovision es una transmisión en YouTube desde el BioMuseo Xolotlcalli que combina monitoreo permanente de los ajolotes con dinámicas onchain durante la transmisión. Los espectadores pueden disparar acciones, votaciones y registros que quedan asentados en la cadena.
  en: Axolovision is a YouTube livestream from the Xolotlcalli BioMuseum that pairs continuous monitoring of the axolotls with live onchain dynamics. Viewers can trigger actions, votes and on-record events that settle on chain.
  pt: A Axolovision é uma transmissão no YouTube desde o BioMuseu Xolotlcalli que combina monitoramento contínuo dos axolotes com dinâmicas onchain ao vivo. Espectadores podem disparar ações, votações e registros que se assentam na cadeia.
