blurb:
  es: "Conservación participativa: explora el archivo de grabaciones de los ajolotes, detecta comportamientos y súmalos a un registro abierto."
  en: "Participatory conservation: browse the axolotls' recording archive, spot behaviours and add them to an open record."
  pt: "Conservação participativa: explore o arquivo de gravações dos axolotes, detecte comportamentos e acrescente-os a um registro aberto."
description:
  es: "Xovi (antes Axolovision) es la capa de participación de AxoloDAO sobre el video del Museo de Ajolotes Xolotlcalli: las grabaciones de cada cámara quedan en un archivo disponible en cualquier momento. Quien las mira detecta comportamientos de los ajolotes, los envía como clips y la comunidad los valida. El registro de esas contribuciones mediante atestaciones EAS está en pruebas en una red de prueba de Ethereum, y las recompensas por clip están en desarrollo. Las suscripciones Aliado y Guardián funcionan como una adopción colectiva simbólica, un apoyo recurrente que sostiene el cuidado de la colonia, junto a un nivel gratuito, Visitante, siempre abierto."
  en: "Xovi (formerly Axolovision) is AxoloDAO's participation layer over the video from the Museo de Ajolotes Xolotlcalli: every camera's recordings stay in an archive available at any time. Viewers spot axolotl behaviours, submit them as clips and the community validates them. Recording those contributions through EAS attestations is being tested on an Ethereum test network, and per-clip rewards are in development. The Aliado and Guardián subscriptions work as a symbolic collective adoption, recurring support for the colony's care, alongside an always-open free tier, Visitante."
  pt: "Xovi (antes Axolovision) é a camada de participação da AxoloDAO sobre o vídeo do Museo de Ajolotes Xolotlcalli: as gravações de cada câmera ficam num arquivo disponível a qualquer momento. Quem assiste detecta comportamentos dos axolotes, envia-os como clipes e a comunidade os valida. O registro dessas contribuições por meio de atestações EAS está em testes numa rede de testes da Ethereum, e as recompensas por clipe estão em desenvolvimento. As assinaturas Aliado e Guardián funcionam como uma adoção coletiva simbólica, um apoio recorrente ao cuidado da colônia, junto a um nível gratuito, Visitante, sempre aberto."
