blurb:
  es: "Conservación participativa: explora el archivo de grabaciones de los ajolotes, detecta comportamientos y súmalos a un registro abierto."
  en: "Participatory conservation: browse the axolotls' recording archive, spot behaviours and add them to an open record."
  pt: "Conservação participativa: explore o arquivo de gravações dos axolotes, detecte comportamentos e acrescente-os a um registro aberto."
description:
  es: "Xovi (antes Axolovision) es la capa de participación de AxoloDAO sobre el video del Museo de Ajolotes Xolotlcalli (2025–2026): las grabaciones de cada cámara quedaron en un archivo disponible en cualquier momento. Quien las mira detecta comportamientos de los ajolotes y los envía como clips, y una persona los revisa y los confirma. El registro de esas confirmaciones con atestaciones EAS se prueba en una red de prueba de Ethereum. Las suscripciones Aliado y Guardián dan acceso al archivo, a los clips y a los datos, junto a un nivel gratuito, Visitante, siempre abierto."
  en: "Xovi (formerly Axolovision) is AxoloDAO's participation layer over the video from the Museo de Ajolotes Xolotlcalli (2025–2026): every camera's recordings remain in an archive available at any time. Viewers spot axolotl behaviours and submit them as clips, and a person reviews and confirms them. Recording those confirmations with EAS attestations is being tested on an Ethereum test network. The Aliado and Guardián subscriptions give access to the archive, the clips and the data, alongside an always-open free tier, Visitante."
  pt: "Xovi (antes Axolovision) é a camada de participação da AxoloDAO sobre o vídeo do Museo de Ajolotes Xolotlcalli (2025–2026): as gravações de cada câmera ficaram num arquivo disponível a qualquer momento. Quem assiste detecta comportamentos dos axolotes e os envia como clipes, e uma pessoa os revisa e confirma. O registro dessas confirmações com atestações EAS está em testes numa rede de testes da Ethereum. As assinaturas Aliado e Guardián dão acesso ao arquivo, aos clipes e aos dados, junto a um nível gratuito, Visitante, sempre aberto."
