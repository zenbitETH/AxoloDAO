description:
  es: "El podcast AxoloDAO reúne a Alex (Xolotlcalli), Juan (Ndali) y Habacuc (Zenbit) para conversar sobre conservación, ciencia, infraestructura pública digital y aprendizajes del Museo de Ajolotes Xolotlcalli. Cada episodio se publica en el canal de YouTube de AxoloDAO y queda como archivo abierto."
  en: "The AxoloDAO podcast brings together Alex (Xolotlcalli), Juan (Ndali) and Habacuc (Zenbit) to talk about conservation, science, public digital infrastructure and lessons from the Museo de Ajolotes Xolotlcalli. Every episode is published on AxoloDAO's YouTube channel and stays as an open archive."
  pt: "O podcast AxoloDAO reúne Alex (Xolotlcalli), Juan (Ndali) e Habacuc (Zenbit) para conversar sobre conservação, ciência, infraestrutura pública digital e aprendizados do Museo de Ajolotes Xolotlcalli. Cada episódio é publicado no canal do YouTube da AxoloDAO e permanece como um arquivo aberto."
