description:
  es: El podcast AxoloDAO reúne a Alex (Xolotlcalli), Juan (Ndali) y Habacuc (Zenbit) para conversar sobre conservación, ciencia, infraestructura pública digital y aprendizajes del Biomuseo. Cada episodio se publica en el canal de YouTube de Xolotlcalli y queda como archivo abierto.
  en: The AxoloDAO podcast brings together Alex (Xolotlcalli), Juan (Ndali) and Habacuc (Zenbit) to talk about conservation, science, public digital infrastructure and lessons from the Biomuseo. Episodes are published on Xolotlcalli's YouTube channel and stay as an open archive.
  pt: O podcast AxoloDAO reúne Alex (Xolotlcalli), Juan (Ndali) e Habacuc (Zenbit) para conversar sobre conservação, ciência, infraestrutura pública digital e aprendizados do Biomuseo. Cada episódio é publicado no canal do YouTube da Xolotlcalli e permanece como um arquivo aberto.
