description:
  es: AxoloDAO System será la infraestructura de datos abierta del nodo. Actualmente en desarrollo en colaboración con Inteli (Instituto de Tecnologia e Liderança, São Paulo), articulará sensores, registros de campo y atestaciones onchain en una sola capa de datos pública y verificable.
  en: AxoloDAO System will be the node's open data infrastructure. Currently in development in collaboration with Inteli (Instituto de Tecnologia e Liderança, São Paulo), it will knit together sensors, field records and onchain attestations into a single public, verifiable data layer.
  pt: O AxoloDAO System será a infraestrutura de dados aberta do nó. Atualmente em desenvolvimento em colaboração com a Inteli (Instituto de Tecnologia e Liderança, São Paulo), articulará sensores, registros de campo e atestações onchain em uma única camada de dados pública e verificável.
